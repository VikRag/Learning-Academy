<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Learning Academy</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #4f6ef7;
    --text: #1a1d2e;
    --text-muted: #7b7f96;
    --border: #e4e6f0;
    --surface: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f6fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    padding: 40px;
    max-width: 400px;
    width: 100%;
  }

  h1 { font-size: 1.5em; margin-bottom: 6px; }
  .sub { color: var(--text-muted); margin-bottom: 20px; }

  .field { margin-bottom: 14px; }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  button {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
  }

  .footer-text {
    margin-top: 15px;
    font-size: 0.9em;
  }

  
  .lang-toggle { display: flex; gap: 4px; }
  .lang-btn {
    padding: 5px 10px; border-radius: 7px; border: 1.5px solid var(--border);
    background: var(--surface); font-family: inherit; font-size: 0.75em; font-weight: 700;
    color: var(--text-muted); cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--primary); }
  .lang-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.footer-text a {
    color: var(--primary);
    text-decoration: none;
  }
</style>
</head>

<body>

<div class="lang-toggle" style="position:fixed;top:20px;right:20px;z-index:10;">
  <button class="lang-btn active" data-lang="en" onclick="window.applyLanguage('en')">EN</button>
  <button class="lang-btn" data-lang="es" onclick="window.applyLanguage('es')">ES</button>
</div>

<div class="card">
  <h1 data-i18n="login_welcome">Welcome back!</h1>
  <p class="sub" data-i18n="login_sub">Log in to your account</p>

  <div class="field">
    <input id="email" type="email" placeholder="Email" data-i18n-ph="login_email_ph">
  </div>

  <div class="field">
    <input id="password" type="password" placeholder="Password" data-i18n-ph="login_password_ph">
  </div>

  <button onclick="login()" data-i18n="login_btn">Log In →</button>

  <div class="footer-text">
    <span data-i18n="login_noaccount">Don’t have an account?</span> <a href="signup.html" data-i18n="login_signup_link">Sign up</a>
  </div>
</div>

<!-- 🔥 FIREBASE LOGIN -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCcIgbm_Qk3w60r6F-Yo-vgUOvp28KBDis",
    authDomain: "learning-academy-1063f.firebaseapp.com",
    projectId: "learning-academy-1063f",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 🔐 LOGIN FUNCTION
  window.login = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert("Logged in!");
      window.location.href = "dashboard.html";
    } catch (e) {
      alert("Error: " + e.message);
    }
  };

  // 🔁 AUTO REDIRECT if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "dashboard.html";
    }
  });
</script>

window.applyLanguage = function (lang) {
  const dict = window.I18N[lang] || window.I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] != null) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    if (dict[key] != null) el.placeholder = dict[key];
  });
  document.documentElement.lang = lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
};

document.addEventListener('DOMContentLoaded', function () {
  let saved = 'en';
  try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
  window.applyLanguage(saved);
});
