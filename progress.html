<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ════════════════════════════════════════════════════════════════
   MASTERY ENGINE (inlined) — identical across dashboard.html,
   progress.html, and quiz.html so every page computes the exact
   same numbers from the exact same quiz history.
   ════════════════════════════════════════════════════════════════ */
const PRIOR_ATTEMPTS = 4;
const PRIOR_MEAN = 0.5;
const RECENT_WINDOW = 3;
const RECENT_WEIGHT = 2;
const MASTERED_MIN_ATTEMPTS = 8;
const MASTERED_THRESHOLD = 85;
const NEEDS_PRACTICE_MIN_ATTEMPTS = 3;
const NEEDS_PRACTICE_THRESHOLD = 70;
const STRENGTH_THRESHOLD = 75;

function toDate(ts) {
  if (!ts) return new Date(0);
  if (typeof ts.toDate === 'function') return ts.toDate();
  return new Date(ts);
}

function formatDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}

function dateKey(d) { return d.toISOString().slice(0, 10); }

function calculateMastery(events) {
  if (!events || events.length === 0) return { mastery: null, attempts: 0, isMastered: false };
  const sorted = [...events].sort((a, b) => a.timestamp - b.timestamp);
  let weightedCorrect = 0, weightedTotal = 0, attempts = 0;
  sorted.forEach((e, i) => {
    const isRecent = i >= sorted.length - RECENT_WINDOW;
    const w = isRecent ? RECENT_WEIGHT : 1;
    weightedCorrect += e.correct * w; weightedTotal += e.total * w; attempts += e.total;
  });
  const smoothedCorrect = weightedCorrect + PRIOR_ATTEMPTS * PRIOR_MEAN;
  const smoothedTotal = weightedTotal + PRIOR_ATTEMPTS;
  const mastery = Math.round((smoothedCorrect / smoothedTotal) * 100);
  const isMastered = attempts >= MASTERED_MIN_ATTEMPTS && mastery >= MASTERED_THRESHOLD;
  return { mastery, attempts, isMastered };
}

function masteryHistory(events) {
  const sorted = [...events].sort((a, b) => a.timestamp - b.timestamp);
  const history = [];
  for (let i = 0; i < sorted.length; i++) {
    const prefix = sorted.slice(0, i + 1);
    const { mastery, attempts } = calculateMastery(prefix);
    history.push({ timestamp: sorted[i].timestamp, mastery, attempts });
  }
  return history;
}

function buildTopicMap(quizResults) {
  const map = {};
  const sorted = [...quizResults].sort((a, b) => toDate(a.timestamp) - toDate(b.timestamp));
  sorted.forEach(r => {
    const ts = toDate(r.timestamp);
    const breakdown = r.topicBreakdown || {};
    Object.entries(breakdown).forEach(([topic, d]) => {
      const key = `${r.subject || 'Unknown'}::${r.grade || '?'}::${topic}`;
      if (!map[key]) map[key] = { topic, subject: r.subject || 'Unknown', grade: r.grade || '?', events: [] };
      map[key].events.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts });
    });
  });
  return map;
}

function computeTopicMastery(quizResults) {
  const map = buildTopicMap(quizResults);
  return Object.values(map).map(t => ({ ...t, ...calculateMastery(t.events) }));
}

function computeOverallMastery(quizResults) {
  const allEvents = [];
  quizResults.forEach(r => {
    const ts = toDate(r.timestamp);
    Object.values(r.topicBreakdown || {}).forEach(d => allEvents.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts }));
  });
  return calculateMastery(allEvents);
}

function computeSubjectReadiness(quizResults, subject, grade) {
  const events = [];
  quizResults.filter(r => r.subject === subject && String(r.grade) === String(grade)).forEach(r => {
    const ts = toDate(r.timestamp);
    Object.values(r.topicBreakdown || {}).forEach(d => events.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts }));
  });
  return calculateMastery(events);
}

function isActionable(topic) { return topic && topic.mastery !== null && topic.attempts >= NEEDS_PRACTICE_MIN_ATTEMPTS; }

function getWeakTopics(topicMasteryList) {
  return topicMasteryList.filter(t => isActionable(t) && !t.isMastered && t.mastery < NEEDS_PRACTICE_THRESHOLD).sort((a, b) => a.mastery - b.mastery);
}

function getLearningNeedsSummary(topicMasteryList) {
  const actionable = topicMasteryList.filter(isActionable);
  const weakTopics = getWeakTopics(topicMasteryList);
  return { weakTopics, hasEnoughData: actionable.length > 0, allStrong: actionable.length > 0 && weakTopics.length === 0 };
}

function getStrengthsAndWeaknesses(topicMasteryList) {
  const actionable = topicMasteryList.filter(isActionable);
  const strengths = actionable.filter(t => t.mastery >= STRENGTH_THRESHOLD).sort((a, b) => b.mastery - a.mastery).slice(0, 3);
  const weaknesses = getWeakTopics(topicMasteryList).slice(0, 3);
  return { strengths, weaknesses };
}

function getRecommendation(topicMasteryList, lastPracticedTopics = []) {
  const weak = getWeakTopics(topicMasteryList);
  if (weak.length === 0) return null;
  const notJustPracticed = weak.filter(t => !lastPracticedTopics.includes(t.topic));
  return notJustPracticed.length > 0 ? notJustPracticed[0] : weak[0];
}

function computeStreak(quizResults) {
  if (quizResults.length === 0) return 0;
  const days = new Set(quizResults.map(r => dateKey(toDate(r.timestamp))));
  let streak = 0;
  const cursor = new Date();
  if (!days.has(dateKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (days.has(dateKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}

function computeAchievements(quizResults) {
  const topicList = computeTopicMastery(quizResults);
  const unlocked = [];
  if (topicList.some(t => t.isMastered)) unlocked.push({ id: 'first-mastery', icon: '🏅', title: 'First Mastery', desc: 'Mastered your first topic' });
  const gotBetter = topicList.some(t => { const hist = masteryHistory(t.events); return hist.some((h, i) => i > 0 && h.mastery - hist[i - 1].mastery >= 10); });
  if (gotBetter) unlocked.push({ id: 'getting-better', icon: '📈', title: 'Getting Better', desc: 'Improved a topic by 10% or more' });
  if (computeStreak(quizResults) >= 5) unlocked.push({ id: 'consistency', icon: '🔥', title: 'Consistency', desc: '5-day study streak' });
  if (quizResults.some(r => r.percentage === 100)) unlocked.push({ id: 'perfect-score', icon: '💯', title: 'Perfect Score', desc: '100% on a practice session' });
  const subjects = [...new Set(quizResults.map(r => r.subject).filter(Boolean))];
  const subjectMastered = subjects.some(s => {
    const events = [];
    quizResults.filter(r => r.subject === s).forEach(r => {
      const ts = toDate(r.timestamp);
      Object.values(r.topicBreakdown || {}).forEach(d => events.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts }));
    });
    const m = calculateMastery(events);
    return m.attempts >= MASTERED_MIN_ATTEMPTS && m.mastery >= 90;
  });
  if (subjectMastered) unlocked.push({ id: 'subject-master', icon: '🎓', title: 'Subject Master', desc: 'Reached 90% mastery in a subject' });
  const comeback = topicList.some(t => {
    const hist = masteryHistory(t.events);
    if (hist.length < 2) return false;
    let low = hist[0].mastery;
    for (const h of hist) { if (h.mastery - low >= 20 && low < 50) return true; low = Math.min(low, h.mastery); }
    return false;
  });
  if (comeback) unlocked.push({ id: 'comeback', icon: '🔄', title: 'Comeback', desc: 'Improved a previously weak topic by 20%' });
  return unlocked;
}

function computeProgressStats(quizResults) {
  const questionsAnswered = quizResults.reduce((s, r) => s + (r.total || 0), 0);
  const correctTotal = quizResults.reduce((s, r) => s + (r.score || 0), 0);
  const accuracy = questionsAnswered > 0 ? Math.round((correctTotal / questionsAnswered) * 100) : null;
  const topicsPracticed = new Set();
  quizResults.forEach(r => Object.keys(r.topicBreakdown || {}).forEach(t => topicsPracticed.add(t)));
  const studySeconds = quizResults.reduce((s, r) => s + (r.timeTakenSeconds || 0), 0);
  const streak = computeStreak(quizResults);
  const overall = computeOverallMastery(quizResults);
  return { overallMastery: overall.mastery, questionsAnswered, accuracy, topicsPracticed: topicsPracticed.size, studySeconds, studyTimeLabel: formatDuration(studySeconds), streak };
}

// Fixed size of the full Learning Academy curriculum (all subjects,
// all grades): Math 94 + English 81 + Social 43 + Science 46 = 264
// topics. "Overall Mastery" and "Subject Mastery" are always shown
// against these fixed, real totals — not a total scoped to only the
// subjects/grades a given student has practiced — so every student's
// numbers are comparable apples-to-apples and can never contradict
// the fraction shown on the Dashboard.
const TOTAL_CURRICULUM_TOPICS = 264;
const SUBJECT_TOPIC_TOTALS = { Math: 94, English: 81, Social: 43, Science: 46 };

// "Overall Mastery" is topics-mastered / 264 (the full curriculum),
// not a blended percentage and not a total scoped to only the
// subjects this student has practiced.
function computeMasteryRatio(quizResults) {
  const topics = computeTopicMastery(quizResults).filter(t => t.attempts > 0);
  const masteredCount = topics.filter(t => t.isMastered).length;
  return { masteredCount, totalTopics: TOTAL_CURRICULUM_TOPICS };
}

// Weekly series of the SAME ratio shown as "Overall Mastery" —
// cumulative topics mastered (across every subject) divided by the
// fixed 264-topic curriculum, as a percentage — so the trend line
// can never disagree with the headline number it is charting.
function computeWeeklyMasteryRatioSeries(quizResults, totalTopics) {
  if (quizResults.length === 0) return [];
  const sorted = [...quizResults].sort((a, b) => toDate(a.timestamp) - toDate(b.timestamp));
  const firstDate = toDate(sorted[0].timestamp);
  const weekOf = (d) => Math.floor((d - firstDate) / (7 * 24 * 3600 * 1000));
  const byWeek = {};
  sorted.forEach(r => { const w = weekOf(toDate(r.timestamp)); if (!byWeek[w]) byWeek[w] = []; byWeek[w].push(r); });
  const weeks = Object.keys(byWeek).map(Number).sort((a, b) => a - b);
  let cumulative = [];
  return weeks.map(w => {
    cumulative = cumulative.concat(byWeek[w]);
    const topics = computeTopicMastery(cumulative).filter(t => t.attempts > 0);
    const masteredCount = topics.filter(t => t.isMastered).length;
    const pct = totalTopics > 0 ? Math.round((masteredCount / totalTopics) * 100) : 0;
    return { week: w + 1, mastery: pct };
  });
}

const Mastery = {
  toDate, formatDuration, calculateMastery, masteryHistory, buildTopicMap, computeTopicMastery,
  computeOverallMastery, computeSubjectReadiness, isActionable, getWeakTopics, getLearningNeedsSummary,
  getStrengthsAndWeaknesses, getRecommendation, computeStreak, computeAchievements, computeProgressStats,
  computeMasteryRatio, computeWeeklyMasteryRatioSeries,
  TOTAL_CURRICULUM_TOPICS, SUBJECT_TOPIC_TOTALS
};
/* ══════════════════ END MASTERY ENGINE ══════════════════ */

const firebaseConfig = {
  apiKey: "AIzaSyCcIgbm_Qk3w60r6F-Yo-vgUOvp28KBDis",
  authDomain: "learning-academy-1063f.firebaseapp.com",
  projectId: "learning-academy-1063f",
  storageBucket: "learning-academy-1063f.firebasestorage.app",
  messagingSenderId: "388313798196",
  appId: "1:388313798196:web:23de2662c83deae6d25c61"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }

  let name = "Student", initial = "?";
  try {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (userDoc.exists()) {
      const data = userDoc.data();
      const full = `${data.firstName || ""} ${data.lastName || ""}`.trim();
      if (full) { name = full; initial = full.charAt(0).toUpperCase(); }
    }
    if (name === "Student" && user.email) { name = user.email.split("@")[0]; initial = user.email.charAt(0).toUpperCase(); }
  } catch (e) { console.error(e); }

  document.getElementById("navUserName").textContent = name;
  document.getElementById("avatarInitial").textContent = initial;

  let results = [];
  try {
    const q = query(collection(db, "users", user.uid, "quizResults"), orderBy("timestamp", "desc"));
    const snap = await getDocs(q);
    results = snap.docs.map(d => d.data());
  } catch (e) { console.error("Error loading results:", e); }

  render(results);

  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainPage").style.display = "block";
});

function render(results) {
  renderOverall(results);
  renderSubjects(results);
  renderChart(results);
  renderQuizHistory(results);
}

function renderOverall(results) {
  if (results.length === 0) {
    document.getElementById("overallBody").innerHTML = `
      <div class="empty-state"><div class="icon">📊</div>
      No progress to show yet — <a href="quiz.html" style="color:var(--primary);font-weight:600;">take your first quiz</a> to start tracking mastery.</div>`;
    return;
  }
  const stats = Mastery.computeProgressStats(results);
  const ratio = Mastery.computeMasteryRatio(results);
  const ratioPct = ratio.totalTopics > 0 ? (ratio.masteredCount / ratio.totalTopics * 100) : 0;
  const ratioDecimal = ratioPct.toFixed(2);
  document.getElementById("overallBody").innerHTML = `
    <div class="mastery-hero-value">${ratioDecimal}% <span style="font-size:.4em;font-weight:700;color:var(--text-muted);">(${ratio.masteredCount}/${ratio.totalTopics} topics mastered)</span></div>
    <div class="mastery-bar-track"><div class="mastery-bar-fill" id="ovBar" data-target="${ratioPct}"></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:0.85em;color:var(--text-muted);font-weight:600;margin-top:14px;">
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.questionsAnswered}</strong> Questions</span>
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.accuracy ?? '—'}%</strong> Accuracy</span>
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.topicsPracticed}</strong> Topics</span>
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.studyTimeLabel}</strong> Study Time</span>
      <span>🔥 <strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.streak}</strong> Day Streak</span>
    </div>`;
  requestAnimationFrame(() => setTimeout(() => {
    const el = document.getElementById("ovBar");
    if (el) el.style.width = el.dataset.target + "%";
  }, 100));
}

function renderSubjects(results) {
  const card = document.getElementById("subjectCard");
  const topics = Mastery.computeTopicMastery(results).filter(t => t.attempts > 0);
  if (topics.length === 0) { card.style.display = "none"; return; }
  card.style.display = "block";

  const bySubject = {};
  topics.forEach(t => { if (!bySubject[t.subject]) bySubject[t.subject] = []; bySubject[t.subject].push(t); });

  const html = Object.entries(bySubject).map(([subject, list], idx) => {
    // Subject Mastery = (# topics mastered in this subject) / (total
    // # topics that exist in this subject's curriculum), as a
    // percentage — not a weighted average of practiced-topic scores.
    const masteredCount = list.filter(t => t.isMastered).length;
    const subjectTotal = Mastery.SUBJECT_TOPIC_TOTALS[subject] || list.length;
    const mastery = subjectTotal > 0 ? Math.round((masteredCount / subjectTotal) * 100) : 0;
    const sortedList = [...list].sort((a, b) => a.mastery - b.mastery);
    const detailId = `detail-${idx}`;
    const detailHTML = sortedList.map(t => `
      <div class="topic-detail-row">
        <div class="topic-detail-top">
          <span class="uname">${t.topic}${t.isMastered ? ' <span style="color:var(--green);font-size:0.85em;">✓ Mastered</span>' : ''}</span>
          <span class="upct">${t.mastery}%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${t.mastery}%;"></div></div>
      </div>`).join('');

    return `
      <div class="subject-row-block" onclick="document.getElementById('${detailId}').classList.toggle('open'); this.querySelector('.chevron').classList.toggle('open');">
        <div class="subject-row-top">
          <span class="name"><span class="chevron">▶</span> ${subject}</span>
          <span class="pct">${masteredCount}/${subjectTotal} · ${mastery}%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${mastery}%;"></div></div>
        <div class="topic-detail" id="${detailId}">${detailHTML}</div>
      </div>`;
  }).join('');

  document.getElementById("subjectBody").innerHTML = html;
}

function renderChart(results) {
  const card = document.getElementById("chartCard");
  const series = Mastery.computeWeeklyMasteryRatioSeries(results, Mastery.TOTAL_CURRICULUM_TOPICS);
  if (series.length < 2) {
    card.style.display = "block";
    document.getElementById("chartBody").innerHTML = `
      <div class="empty-state"><div class="icon">📈</div>Keep practicing across a few more sessions to see your mastery trend over time.</div>`;
    return;
  }
  card.style.display = "block";

  const w = 700, h = 170, pad = 30;
  const maxWeek = series[series.length - 1].week;
  const xFor = (week) => pad + (week - 1) / Math.max(1, maxWeek - 1) * (w - pad * 2);
  const yFor = (pct) => h - pad - (pct / 100) * (h - pad * 1.5);

  const points = series.map(p => `${xFor(p.week)},${yFor(p.mastery)}`).join(' ');
  const dots = series.map(p => `<circle cx="${xFor(p.week)}" cy="${yFor(p.mastery)}" r="4" fill="var(--primary)" />`).join('');
  const gridLines = [0, 25, 50, 75, 100].map(v => `
    <line x1="${pad}" y1="${yFor(v)}" x2="${w - pad}" y2="${yFor(v)}" stroke="var(--border)" stroke-width="1" />
    <text x="2" y="${yFor(v) + 4}" font-size="10" fill="var(--text-muted)" font-family="DM Mono, monospace">${v}%</text>`).join('');
  const xLabels = series.map(p => `<text x="${xFor(p.week)}" y="${h - 6}" font-size="10" fill="var(--text-muted)" text-anchor="middle" font-family="DM Mono, monospace">W${p.week}</text>`).join('');

  document.getElementById("chartBody").innerHTML = `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <polyline points="${points}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      ${dots}
      ${xLabels}
    </svg>`;
}

/* ── Quiz History (moved here from dashboard.html) ──
   Subject-filterable table of every quiz result, capped at the last
   10 for whichever filter is active. results is already sorted
   newest-first by the Firestore query, so "last 10" is just a slice
   after filtering — no re-sort needed. */
const HISTORY_PAGE_SIZE = 10;
let historyResultsCache = [];

function renderQuizHistory(results) {
  const card = document.getElementById('historyCard');
  if (results.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  historyResultsCache = results;
  const subjects = [...new Set(results.map(r => r.subject).filter(Boolean))];
  const filterBar = document.getElementById('historyFilters');

  if (subjects.length <= 1) {
    filterBar.innerHTML = '';
  } else {
    const pills = ['all', ...subjects];
    filterBar.innerHTML = pills.map(s => `
      <button class="history-filter-btn${s === 'all' ? ' active' : ''}" data-subject="${s}" onclick="window.__filterHistory('${s.replace(/'/g, "\\'")}')">
        ${s === 'all' ? 'All Subjects' : s}
      </button>`).join('');
  }

  renderHistoryTable(results, 'all');
}

window.__filterHistory = function (subject) {
  document.querySelectorAll('.history-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.subject === subject));
  renderHistoryTable(historyResultsCache, subject);
};

function renderHistoryTable(results, subjectFilter) {
  const filtered = subjectFilter === 'all' ? results : results.filter(r => r.subject === subjectFilter);
  const shown = filtered.slice(0, HISTORY_PAGE_SIZE);

  const label = subjectFilter === 'all' ? 'quizzes' : `${subjectFilter} quizzes`;
  document.getElementById("historyCount").textContent =
    filtered.length > HISTORY_PAGE_SIZE
      ? `Showing last ${HISTORY_PAGE_SIZE} of ${filtered.length} ${label}`
      : `${filtered.length} ${label}`;

  if (shown.length === 0) {
    document.getElementById("historyTableWrap").innerHTML =
      `<div class="empty-state"><div class="icon">📝</div>No ${subjectFilter === 'all' ? '' : subjectFilter + ' '}quizzes yet.</div>`;
    return;
  }

  const rows = shown.map((r, i) => {
    const pct = r.percentage || 0;
    const badgeCls = pct >= 90 ? "pct-great" : pct >= 70 ? "pct-pass" : pct >= 50 ? "pct-ok" : "pct-low";
    const timeStr = r.timestamp ? (r.timestamp.toDate ? r.timestamp.toDate() : new Date(r.timestamp)).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—";
    return `
      <tr>
        <td style="color:var(--text-muted);font-family:'DM Mono',monospace;font-size:0.78em;">#${filtered.length - i}</td>
        <td><span class="subject-pill">${r.subject || "—"}</span></td>
        <td>Grade ${r.grade || "—"}</td>
        <td>${r.score || 0} / ${r.total || "—"}</td>
        <td><span class="pct-badge ${badgeCls}">${pct}%</span></td>
        <td style="color:var(--text-muted);font-size:0.82em;">${timeStr}</td>
      </tr>`;
  }).join('');

  document.getElementById("historyTableWrap").innerHTML = `
    <table class="quiz-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Subject</th>
          <th>Grade</th>
          <th>Score</th>
          <th>Percentage</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

window.applyLanguage = function (lang) {
  const dict = window.I18N[lang] || window.I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] != null) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    if (dict[key] != null) el.placeholder = dict[key];
  });
  document.documentElement.lang = lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
};

document.addEventListener('DOMContentLoaded', function () {
  let saved = 'en';
  try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
  window.applyLanguage(saved);
});
