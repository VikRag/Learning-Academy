<!DOCTYPE html>
<html lang="en">
<head>

<title>Progress – Learning Academy</title>

<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #f0f1f7;
    --border: #e4e6f0;
    --text: #1a1d2e;
    --text-muted: #7b7f96;
    --primary: #4f6ef7;
    --primary-light: #eef1fe;
    --green: #22c55e;
    --green-light: #dcfce7;
    --red: #ef4444;
    --amber: #f59e0b;
    --amber-light: #fef3c7;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 60px; }

  .topnav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 8px rgba(0,0,0,0.05);
  }
  .nav-left { display: flex; align-items: center; gap: 12px; }
  .logo-chip { font-size: 1em; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
  .nav-divider { width: 1px; height: 20px; background: var(--border); }
  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-link { padding: 6px 12px; border-radius: 8px; font-size: 0.85em; font-weight: 600; color: var(--text-muted); text-decoration: none; transition: all .15s; }
  .nav-link:hover, .nav-link.active { color: var(--primary); background: var(--primary-light); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .user-chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 99px; font-size: 0.85em; font-weight: 600; color: var(--text); }
  .user-avatar { width: 26px; height: 26px; background: var(--primary); border-radius: 99px; display: flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: 800; color: white; flex-shrink: 0; }
  .btn-quiz { padding: 8px 16px; background: var(--primary); border: none; border-radius: 8px; font-family: inherit; font-size: 0.85em; font-weight: 700; color: white; cursor: pointer; transition: all 0.15s; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .btn-quiz:hover { background: #3d5ce5; transform: translateY(-1px); }

  .page { max-width: 860px; margin: 0 auto; padding: 36px 24px 0; }

  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--text-muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 99px; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .page-header { margin-bottom: 28px; }
  .page-header h1 { font-size: 1.6em; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
  .page-header p { font-size: 0.9em; color: var(--text-muted); }

  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 22px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .section-head h2 { font-size: 0.95em; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .section-body { padding: 18px 20px; }

  .empty-state { padding: 36px 20px; text-align: center; color: var(--text-muted); font-size: 0.9em; }
  .empty-state .icon { font-size: 2em; margin-bottom: 8px; }

  .bar-track { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; background: var(--primary); transition: width 1s cubic-bezier(.4,0,.2,1); width: 0; }

  /* Overall mastery hero */
  .mastery-hero-value { font-size: 2.6em; font-weight: 800; font-family: 'DM Mono', monospace; color: var(--primary); line-height: 1; margin-bottom: 10px; }
  .mastery-bar-track { height: 12px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .mastery-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), #7b93ff); transition: width 1.2s cubic-bezier(.4,0,.2,1); width: 0%; }

  /* Subject mastery rows */
  .subject-row-block { margin-bottom: 16px; cursor: pointer; }
  .subject-row-block:last-child { margin-bottom: 0; }
  .subject-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .subject-row-top .name { font-weight: 700; font-size: 0.92em; display: flex; align-items: center; gap: 6px; }
  .subject-row-top .pct  { font-family: 'DM Mono', monospace; font-weight: 700; color: var(--primary); font-size: 0.88em; }
  .chevron { transition: transform .2s; color: var(--text-muted); font-size: 0.8em; }
  .chevron.open { transform: rotate(90deg); }
  .topic-detail { display: none; margin-top: 12px; padding-left: 4px; }
  .topic-detail.open { display: block; }
  .topic-detail-row { margin-bottom: 10px; }
  .topic-detail-row:last-child { margin-bottom: 0; }
  .topic-detail-top { display: flex; justify-content: space-between; font-size: 0.8em; margin-bottom: 3px; }
  .topic-detail-top .uname { font-weight: 600; color: var(--text); }
  .topic-detail-top .upct { font-family: 'DM Mono', monospace; color: var(--text-muted); }

  /* Chart */
  .chart-wrap { padding: 6px 4px 0; }
  .chart-svg { width: 100%; height: 180px; }

  /* Activity feed */
  .activity-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: none; padding-bottom: 0; }
  .activity-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1em; flex-shrink: 0; }
  .activity-icon.green { background: var(--green-light); }
  .activity-icon.blue  { background: var(--primary-light); }
  .activity-icon.amber { background: var(--amber-light); }
  .activity-text { flex: 1; }
  .activity-text .title { font-size: 0.875em; font-weight: 600; margin-bottom: 2px; }
  .activity-text .meta  { font-size: 0.78em; color: var(--text-muted); }
  .activity-time { font-size: 0.75em; color: var(--text-muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

  @media(max-width: 700px) {
    .topnav { padding: 0 16px; }
    .page { padding: 24px 14px 0; }
  }

  .lang-toggle { display: flex; gap: 4px; }
  .lang-btn {
    padding: 5px 10px; border-radius: 7px; border: 1.5px solid var(--border);
    background: var(--surface); font-family: inherit; font-size: 0.75em; font-weight: 700;
    color: var(--text-muted); cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--primary); }
  .lang-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ════════════════════════════════════════════════════════════════
   MASTERY ENGINE (inlined) — see comments below for the reasoning
   behind the algorithm. Kept identical across dashboard.html,
   progress.html, and quiz.html so every page computes the exact
   same numbers from the exact same quiz history.
   ════════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════════════
   mastery.js — AR Learning Academy shared analytics engine
   ════════════════════════════════════════════════════════════════════
   Every dashboard / progress-page / post-quiz number in the app is
   derived from this one module, from the SAME raw source: the
   student's `quizResults` documents in Firestore. Nothing here is
   hardcoded and nothing is stored twice — mastery, readiness,
   recommendations, and achievements are all recomputed from quiz
   history each time they're needed. That keeps the numbers honest
   and avoids two copies of "the truth" drifting apart.

   WHERE THE DATA COMES FROM
   Each quizResult document (already saved by quiz.html) now also
   carries a `topicBreakdown` field:
       topicBreakdown: { "Food Webs": { correct: 3, total: 4 }, ... }
   That's simply a tally of the questions the student saw in THAT
   quiz, grouped by topic. Nothing new to store per-question — we
   already know each question's topic and whether it was answered
   correctly, so we can group it at save time for free.
   ════════════════════════════════════════════════════════════════════ */

/* ── Tunable constants (kept in one place, with reasoning) ── */

// Bayesian smoothing: every topic starts with 4 "phantom" attempts at
// 50%. This is what stops a single lucky/unlucky answer from swinging
// a topic to 100% or 0% mastery — the more real attempts a student
// has, the less the phantom attempts matter, and the score converges
// on their true accuracy.
const PRIOR_ATTEMPTS = 4;
const PRIOR_MEAN = 0.5;

// Recency weighting: a student's last few quiz attempts on a topic
// matter more than attempts from a month ago, because mastery changes
// as they learn. The most recent RECENT_WINDOW quiz-attempts on a
// topic count RECENT_WEIGHT times as much as older ones.
const RECENT_WINDOW = 3;
const RECENT_WEIGHT = 2;

// A topic can't be labeled "Mastered" just because the last couple of
// answers were lucky — it needs a real track record.
const MASTERED_MIN_ATTEMPTS = 8;
const MASTERED_THRESHOLD = 85;

// A topic only counts as "meaningful" for strengths/weaknesses,
// recommendations, and exam-readiness opportunities once it has at
// least this many answered questions — one lucky/unlucky guess can't
// label (or clear) a topic as weak. This is the SAME threshold used
// by every feature that identifies a "weak topic" anywhere in the
// app (see getWeakTopics below) — that consistency is what prevents
// one section saying "Geometry needs practice" while another says
// "no weak topics" for the exact same underlying data.
const NEEDS_PRACTICE_MIN_ATTEMPTS = 3;
const NEEDS_PRACTICE_THRESHOLD = 70;   // mastery below this = "needs practice"
const STRENGTH_THRESHOLD = 75;         // mastery at/above this = "strength"

/* ── Helpers ── */

function toDate(ts) {
  if (!ts) return new Date(0);
  if (typeof ts.toDate === 'function') return ts.toDate();
  return new Date(ts);
}

function formatDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}

function dateKey(d) {
  return d.toISOString().slice(0, 10); // YYYY-MM-DD
}

/* ── Core mastery calculation ──
   events: [{ correct, total, timestamp }], one entry per quiz attempt
   that touched this topic. Order does not need to be sorted — we sort
   internally. Returns null mastery if there is no data at all. */
function calculateMastery(events) {
  if (!events || events.length === 0) {
    return { mastery: null, attempts: 0, isMastered: false };
  }
  const sorted = [...events].sort((a, b) => a.timestamp - b.timestamp);

  let weightedCorrect = 0;
  let weightedTotal = 0;
  let attempts = 0;

  sorted.forEach((e, i) => {
    const isRecent = i >= sorted.length - RECENT_WINDOW;
    const w = isRecent ? RECENT_WEIGHT : 1;
    weightedCorrect += e.correct * w;
    weightedTotal += e.total * w;
    attempts += e.total;
  });

  const smoothedCorrect = weightedCorrect + PRIOR_ATTEMPTS * PRIOR_MEAN;
  const smoothedTotal = weightedTotal + PRIOR_ATTEMPTS;
  const mastery = Math.round((smoothedCorrect / smoothedTotal) * 100);
  const isMastered = attempts >= MASTERED_MIN_ATTEMPTS && mastery >= MASTERED_THRESHOLD;

  return { mastery, attempts, isMastered };
}

/* Mastery as it evolved attempt-by-attempt — powers the "68% → 76%"
   improvement callouts and the mastery-over-time chart. */
function masteryHistory(events) {
  const sorted = [...events].sort((a, b) => a.timestamp - b.timestamp);
  const history = [];
  for (let i = 0; i < sorted.length; i++) {
    const prefix = sorted.slice(0, i + 1);
    const { mastery, attempts } = calculateMastery(prefix);
    history.push({ timestamp: sorted[i].timestamp, mastery, attempts });
  }
  return history;
}

/* ── Build topic-level event map from raw quizResults ── */
function buildTopicMap(quizResults) {
  // key -> { topic, subject, grade, events: [] }
  const map = {};
  const sorted = [...quizResults].sort((a, b) => toDate(a.timestamp) - toDate(b.timestamp));

  sorted.forEach(r => {
    const ts = toDate(r.timestamp);
    const breakdown = r.topicBreakdown || {};
    Object.entries(breakdown).forEach(([topic, d]) => {
      const key = `${r.subject || 'Unknown'}::${r.grade || '?'}::${topic}`;
      if (!map[key]) {
        map[key] = { topic, subject: r.subject || 'Unknown', grade: r.grade || '?', events: [] };
      }
      map[key].events.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts });
    });
  });

  return map;
}

/* Topic mastery, one row per topic (subject+grade+topic), with mastery
   computed. Sorted by subject then mastery ascending isn't forced here
   — callers sort as needed. */
function computeTopicMastery(quizResults) {
  const map = buildTopicMap(quizResults);
  return Object.values(map).map(t => ({
    ...t,
    ...calculateMastery(t.events),
  }));
}

/* Overall mastery across everything the student has ever done. Uses
   the same smoothing/recency logic, just applied to every event from
   every topic at once, so a student with lots of practice earns a
   confident number and a brand-new student doesn't get 0%. */
function computeOverallMastery(quizResults) {
  const allEvents = [];
  quizResults.forEach(r => {
    const ts = toDate(r.timestamp);
    Object.values(r.topicBreakdown || {}).forEach(d => {
      allEvents.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts });
    });
  });
  return calculateMastery(allEvents);
}

/* Exam readiness for one subject+grade = mastery aggregated over just
   that subject's events. Same honest math — a student who has only
   answered a handful of questions will not see a high number, because
   the Bayesian prior pulls a low-attempt score toward 50%. */
function computeSubjectReadiness(quizResults, subject, grade) {
  const events = [];
  quizResults
    .filter(r => r.subject === subject && String(r.grade) === String(grade))
    .forEach(r => {
      const ts = toDate(r.timestamp);
      Object.values(r.topicBreakdown || {}).forEach(d => {
        events.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts });
      });
    });
  return calculateMastery(events);
}

/* ══════════════════════════════════════════════════════════════════
   LEARNING NEEDS ENGINE — the single source of truth for "is this
   topic something the student should work on?"

   Every feature that surfaces a weak topic — Topic Mastery's "Needs
   Practice", the dashboard's "Recommended For You", Exam Readiness's
   "Biggest Opportunity" and "Needs Improvement" list — calls
   getWeakTopics() (directly or through getStrengthsAndWeaknesses /
   getRecommendation, which are now just thin wrappers around it).
   Before this, each of those three features had its OWN minimum-
   attempts threshold, which meant a topic like a 33%-mastery topic
   with only 1-2 attempts could show up as an "opportunity" in one
   place while "Needs Practice" elsewhere said "None" for the exact
   same account — that contradiction is now structurally impossible,
   because there's only one definition of "weak" left in the app.
   ══════════════════════════════════════════════════════════════════ */

// A topic is "actionable" once there's enough real data to trust the
// number — fewer than NEEDS_PRACTICE_MIN_ATTEMPTS real questions and
// we simply don't know enough yet, which is a different situation
// from "the student has proven they understand it."
function isActionable(topic) {
  return topic && topic.mastery !== null && topic.attempts >= NEEDS_PRACTICE_MIN_ATTEMPTS;
}

// The one and only definition of "weak topic" in the app: enough
// data to trust the number, not already mastered, mastery below the
// needs-practice line. Sorted weakest-first.
function getWeakTopics(topicMasteryList) {
  return topicMasteryList
    .filter(t => isActionable(t) && !t.isMastered && t.mastery < NEEDS_PRACTICE_THRESHOLD)
    .sort((a, b) => a.mastery - b.mastery);
}

// Distinguishes "genuinely no weak spots" from "not enough data to
// tell yet" — two very different messages that were being conflated
// before. UI code should check hasEnoughData before claiming a clean
// bill of health.
function getLearningNeedsSummary(topicMasteryList) {
  const actionable = topicMasteryList.filter(isActionable);
  const weakTopics = getWeakTopics(topicMasteryList);
  return {
    weakTopics,
    hasEnoughData: actionable.length > 0,
    allStrong: actionable.length > 0 && weakTopics.length === 0,
  };
}

/* ── Strengths / weaknesses (now built on getWeakTopics) ── */
function getStrengthsAndWeaknesses(topicMasteryList) {
  const actionable = topicMasteryList.filter(isActionable);
  const strengths = actionable
    .filter(t => t.mastery >= STRENGTH_THRESHOLD)
    .sort((a, b) => b.mastery - a.mastery)
    .slice(0, 3);
  const weaknesses = getWeakTopics(topicMasteryList).slice(0, 3);
  return { strengths, weaknesses };
}

/* ── Recommendation: weakest actionable topic, avoiding repeating the
   exact topic the student just practiced if a real alternative exists.
   Now uses the SAME getWeakTopics() list as Needs Practice and Exam
   Readiness — never a topic that Needs Practice would consider
   "insufficient data." ── */
function getRecommendation(topicMasteryList, lastPracticedTopics = []) {
  const weak = getWeakTopics(topicMasteryList);
  if (weak.length === 0) return null;

  const notJustPracticed = weak.filter(t => !lastPracticedTopics.includes(t.topic));
  return notJustPracticed.length > 0 ? notJustPracticed[0] : weak[0];
}

/* ── Study streak: consecutive calendar days (ending today or
   yesterday) that include at least one quiz ── */
function computeStreak(quizResults) {
  if (quizResults.length === 0) return 0;
  const days = new Set(quizResults.map(r => dateKey(toDate(r.timestamp))));
  let streak = 0;
  const cursor = new Date();
  // Streak still counts if today has no activity yet but yesterday does.
  if (!days.has(dateKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (days.has(dateKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

/* ── Achievements ──
   Fully derived from quiz history — nothing is stored, so nothing can
   drift out of sync or "reset." Pass the full quizResults list (or a
   prefix of it, to check what was unlocked before the latest quiz). */
function computeAchievements(quizResults) {
  const topicList = computeTopicMastery(quizResults);
  const unlocked = [];

  // First Mastery
  if (topicList.some(t => t.isMastered)) {
    unlocked.push({ id: 'first-mastery', icon: '🏅', title: 'First Mastery', desc: 'Mastered your first topic' });
  }

  // Getting Better (+10% in one topic's running mastery, attempt to attempt)
  const gotBetter = topicList.some(t => {
    const hist = masteryHistory(t.events);
    return hist.some((h, i) => i > 0 && h.mastery - hist[i - 1].mastery >= 10);
  });
  if (gotBetter) {
    unlocked.push({ id: 'getting-better', icon: '📈', title: 'Getting Better', desc: 'Improved a topic by 10% or more' });
  }

  // Consistency (5-day streak)
  if (computeStreak(quizResults) >= 5) {
    unlocked.push({ id: 'consistency', icon: '🔥', title: 'Consistency', desc: '5-day study streak' });
  }

  // Perfect Score
  if (quizResults.some(r => r.percentage === 100)) {
    unlocked.push({ id: 'perfect-score', icon: '💯', title: 'Perfect Score', desc: '100% on a practice session' });
  }

  // Subject Master (90%+ aggregate mastery in a subject, with real attempts)
  const subjects = [...new Set(quizResults.map(r => r.subject).filter(Boolean))];
  const subjectMastered = subjects.some(s => {
    const events = [];
    quizResults.filter(r => r.subject === s).forEach(r => {
      const ts = toDate(r.timestamp);
      Object.values(r.topicBreakdown || {}).forEach(d => events.push({ correct: d.correct || 0, total: d.total || 0, timestamp: ts }));
    });
    const m = calculateMastery(events);
    return m.attempts >= MASTERED_MIN_ATTEMPTS && m.mastery >= 90;
  });
  if (subjectMastered) {
    unlocked.push({ id: 'subject-master', icon: '🎓', title: 'Subject Master', desc: 'Reached 90% mastery in a subject' });
  }

  // Comeback (+20% from a topic's lowest point to its current mastery)
  const comeback = topicList.some(t => {
    const hist = masteryHistory(t.events);
    if (hist.length < 2) return false;
    let low = hist[0].mastery;
    for (const h of hist) {
      if (h.mastery - low >= 20 && low < 50) return true;
      low = Math.min(low, h.mastery);
    }
    return false;
  });
  if (comeback) {
    unlocked.push({ id: 'comeback', icon: '🔄', title: 'Comeback', desc: 'Improved a previously weak topic by 20%' });
  }

  return unlocked;
}

/* ── Aggregate stats for the "Your Progress" card ── */
function computeProgressStats(quizResults) {
  const questionsAnswered = quizResults.reduce((s, r) => s + (r.total || 0), 0);
  const correctTotal = quizResults.reduce((s, r) => s + (r.score || 0), 0);
  const accuracy = questionsAnswered > 0 ? Math.round((correctTotal / questionsAnswered) * 100) : null;
  const topicsPracticed = new Set();
  quizResults.forEach(r => Object.keys(r.topicBreakdown || {}).forEach(t => topicsPracticed.add(t)));
  const studySeconds = quizResults.reduce((s, r) => s + (r.timeTakenSeconds || 0), 0);
  const streak = computeStreak(quizResults);
  const overall = computeOverallMastery(quizResults);

  return {
    overallMastery: overall.mastery,
    questionsAnswered,
    accuracy,
    topicsPracticed: topicsPracticed.size,
    studySeconds,
    studyTimeLabel: formatDuration(studySeconds),
    streak,
  };
}

/* ── Weekly mastery-over-time series for the Progress page chart ── */
function computeWeeklyMasterySeries(quizResults) {
  if (quizResults.length === 0) return [];
  const sorted = [...quizResults].sort((a, b) => toDate(a.timestamp) - toDate(b.timestamp));
  const firstDate = toDate(sorted[0].timestamp);

  const weekOf = (d) => Math.floor((d - firstDate) / (7 * 24 * 3600 * 1000));
  const byWeek = {};
  sorted.forEach(r => {
    const w = weekOf(toDate(r.timestamp));
    if (!byWeek[w]) byWeek[w] = [];
    byWeek[w].push(r);
  });

  const weeks = Object.keys(byWeek).map(Number).sort((a, b) => a - b);
  let cumulative = [];
  return weeks.map(w => {
    cumulative = cumulative.concat(byWeek[w]);
    const { mastery } = computeOverallMastery(cumulative);
    return { week: w + 1, mastery };
  });
}

/* ── Badges (from raw quiz activity) ──
   Separate from topic-mastery achievements: these celebrate showing
   up and putting in the reps, independent of how hard the topics
   were. Combined with the mastery-based achievements below into one
   list for the Achievements section. */
function computeMilestoneBadges(quizResults) {
  const badges = [];
  const totalQuizzes = quizResults.length;
  const totalQuestions = quizResults.reduce((s, r) => s + (r.total || 0), 0);

  if (totalQuizzes >= 1)  badges.push({ id: 'first-quiz',        icon: '🎬', title: 'First Quiz',   desc: 'Completed your first practice quiz' });
  if (totalQuizzes >= 5)  badges.push({ id: 'five-quizzes',      icon: '🗂️', title: '5 Quizzes',    desc: 'Completed 5 practice quizzes' });
  if (totalQuizzes >= 10) badges.push({ id: 'ten-quizzes',       icon: '📚', title: '10 Quizzes',   desc: 'Completed 10 practice quizzes' });
  if (totalQuizzes >= 25) badges.push({ id: 'twentyfive-quizzes',icon: '🏋️', title: '25 Quizzes',   desc: 'Completed 25 practice quizzes' });

  if (totalQuestions >= 50)  badges.push({ id: 'fifty-questions',    icon: '✏️', title: '50 Questions',  desc: 'Answered 50 questions total' });
  if (totalQuestions >= 100) badges.push({ id: 'hundred-questions',  icon: '📝', title: '100 Questions', desc: 'Answered 100 questions total' });
  if (totalQuestions >= 250) badges.push({ id: 'twofifty-questions', icon: '🎖️', title: '250 Questions', desc: 'Answered 250 questions total' });

  if (quizResults.some(r => r.percentage === 100)) {
    badges.push({ id: 'perfect-score', icon: '💯', title: 'Perfect Score', desc: '100% on a practice session' });
  }

  // Rising accuracy: shows the student is progressing, not just grinding.
  const sorted = [...quizResults].sort((a, b) => toDate(b.timestamp) - toDate(a.timestamp));
  if (sorted.length >= 3 && sorted.slice(0, 3).every(r => (r.percentage || 0) >= 80)) {
    badges.push({ id: 'on-a-roll', icon: '🚀', title: 'On a Roll', desc: '80%+ accuracy on your last 3 quizzes' });
  }

  return badges;
}

// Combined badge list for the Achievements section: milestone badges
// (raw activity) + mastery-based achievements (real understanding).
// Fully derived from quiz history every time — nothing stored, so
// nothing can drift or reset.
function computeAllBadges(quizResults) {
  const seen = new Set();
  return [...computeMilestoneBadges(quizResults), ...computeAchievements(quizResults)]
    .filter(b => (seen.has(b.id) ? false : (seen.add(b.id), true)));
}

/* ── Grade / Subject completion ──
   A subject+grade only "finishes" through sustained, accurate practice
   across real coverage of its topics — never from one lucky session.
   Three ingredients, all shown to the student:
     1. Coverage    — how many of the subject's topics have been touched
     2. Mastery     — how well those topics are actually understood
     3. Consistency — practice spread across multiple days, not crammed
   into one sitting the night before a test. */
const GRADE_COMPLETE_THRESHOLD = 90; // combined coverage+mastery score needed
const GRADE_COMPLETE_MIN_DAYS  = 3;  // distinct practice days required

function distinctPracticeDays(quizResults, subject, grade) {
  const days = new Set();
  quizResults
    .filter(r => r.subject === subject && String(r.grade) === String(grade))
    .forEach(r => days.add(toDate(r.timestamp).toISOString().slice(0, 10)));
  return days.size;
}

// topicCounts: { "Subject::Grade": totalTopicsInCurriculum } — pass {}
// if unknown; coverage then falls back to "topics practiced" as its
// own denominator (100% coverage of what's been seen so far).
function computeGradeProgress(quizResults, topicCounts = {}) {
  const combos = [...new Set(quizResults.map(r => `${r.subject}::${r.grade}`))];
  const topicList = computeTopicMastery(quizResults);

  return combos.map(key => {
    const [subject, grade] = key.split('::');
    const practiced = topicList.filter(t => t.subject === subject && String(t.grade) === String(grade) && t.attempts > 0);
    const masteredCount = practiced.filter(t => t.isMastered).length;
    const totalTopics = topicCounts[key] || practiced.length || 1;
    const coveragePct = Math.round((practiced.length / totalTopics) * 100);
    const { mastery: subjectMastery } = calculateMastery(practiced.flatMap(t => t.events));
    const days = distinctPracticeDays(quizResults, subject, grade);

    const combined = Math.min(100, Math.round(0.5 * coveragePct + 0.5 * (subjectMastery || 0)));
    const isComplete    = combined >= GRADE_COMPLETE_THRESHOLD && days >= GRADE_COMPLETE_MIN_DAYS;
    const needsMoreDays = combined >= GRADE_COMPLETE_THRESHOLD && days < GRADE_COMPLETE_MIN_DAYS;

    return {
      subject, grade,
      topicsPracticed: practiced.length, totalTopics, coveragePct,
      subjectMastery: subjectMastery || 0, masteredCount,
      distinctDays: days, progressPct: combined,
      isComplete, needsMoreDays,
    };
  });
}

const Mastery = {
  toDate,
  formatDuration,
  calculateMastery,
  masteryHistory,
  buildTopicMap,
  computeTopicMastery,
  computeOverallMastery,
  computeSubjectReadiness,
  isActionable,
  getWeakTopics,
  getLearningNeedsSummary,
  getStrengthsAndWeaknesses,
  getRecommendation,
  computeStreak,
  computeAchievements,
  computeProgressStats,
  computeWeeklyMasterySeries,
  computeMilestoneBadges,
  computeAllBadges,
  distinctPracticeDays,
  computeGradeProgress
};

function renderOverall(results) {
  if (results.length === 0) {
    document.getElementById("overallBody").innerHTML = `
      <div class="empty-state"><div class="icon">📊</div>
      No progress to show yet — <a href="quiz.html" style="color:var(--primary);font-weight:600;">take your first quiz</a> to start tracking mastery.</div>`;
    return;
  }
  const stats = Mastery.computeProgressStats(results);
  document.getElementById("overallBody").innerHTML = `
    <div class="mastery-hero-value">${stats.overallMastery ?? '—'}%</div>
    <div class="mastery-bar-track"><div class="mastery-bar-fill" id="ovBar" data-target="${stats.overallMastery ?? 0}"></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:0.85em;color:var(--text-muted);font-weight:600;margin-top:14px;">
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.questionsAnswered}</strong> Questions</span>
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.accuracy ?? '—'}%</strong> Accuracy</span>
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.topicsPracticed}</strong> Topics</span>
      <span><strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.studyTimeLabel}</strong> Study Time</span>
      <span>🔥 <strong style="color:var(--text);font-family:'DM Mono',monospace;">${stats.streak}</strong> Day Streak</span>
    </div>`;
  requestAnimationFrame(() => setTimeout(() => {
    const el = document.getElementById("ovBar");
    if (el) el.style.width = el.dataset.target + "%";
  }, 100));
}

function renderSubjects(results) {
  const card = document.getElementById("subjectCard");
  const topics = Mastery.computeTopicMastery(results).filter(t => t.attempts > 0);
  if (topics.length === 0) { card.style.display = "none"; return; }
  card.style.display = "block";

  const bySubject = {};
  topics.forEach(t => {
    if (!bySubject[t.subject]) bySubject[t.subject] = [];
    bySubject[t.subject].push(t);
  });

  const html = Object.entries(bySubject).map(([subject, list], idx) => {
    const { mastery } = Mastery.calculateMastery(list.flatMap(t => t.events));
    const sortedList = [...list].sort((a, b) => a.mastery - b.mastery);
    const detailId = `detail-${idx}`;
    const detailHTML = sortedList.map(t => `
      <div class="topic-detail-row">
        <div class="topic-detail-top">
          <span class="uname">${t.topic}${t.isMastered ? ' <span style="color:var(--green);font-size:0.85em;">✓ Mastered</span>' : ''}</span>
          <span class="upct">${t.mastery}%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${t.mastery}%;"></div></div>
      </div>`).join('');

    return `
      <div class="subject-row-block" onclick="document.getElementById('${detailId}').classList.toggle('open'); this.querySelector('.chevron').classList.toggle('open');">
        <div class="subject-row-top">
          <span class="name"><span class="chevron">▶</span> ${subject}</span>
          <span class="pct">${mastery}%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${mastery}%;"></div></div>
        <div class="topic-detail" id="${detailId}">${detailHTML}</div>
      </div>`;
  }).join('');

  document.getElementById("subjectBody").innerHTML = html;
}

function renderChart(results) {
  const card = document.getElementById("chartCard");
  const series = Mastery.computeWeeklyMasterySeries(results);
  if (series.length < 2) {
    // Not enough history to draw a trend yet — honest empty state instead
    // of inventing data points.
    card.style.display = "block";
    document.getElementById("chartBody").innerHTML = `
      <div class="empty-state"><div class="icon">📈</div>Keep practicing across a few more sessions to see your mastery trend over time.</div>`;
    return;
  }
  card.style.display = "block";

  const w = 700, h = 170, pad = 30;
  const maxWeek = series[series.length - 1].week;
  const xFor = (week) => pad + (week - 1) / Math.max(1, maxWeek - 1) * (w - pad * 2);
  const yFor = (pct) => h - pad - (pct / 100) * (h - pad * 1.5);

  const points = series.map(p => `${xFor(p.week)},${yFor(p.mastery)}`).join(' ');
  const dots = series.map(p => `<circle cx="${xFor(p.week)}" cy="${yFor(p.mastery)}" r="4" fill="var(--primary)" />`).join('');
  const gridLines = [0, 25, 50, 75, 100].map(v => `
    <line x1="${pad}" y1="${yFor(v)}" x2="${w - pad}" y2="${yFor(v)}" stroke="var(--border)" stroke-width="1" />
    <text x="2" y="${yFor(v) + 4}" font-size="10" fill="var(--text-muted)" font-family="DM Mono, monospace">${v}%</text>`).join('');
  const xLabels = series.map(p => `<text x="${xFor(p.week)}" y="${h - 6}" font-size="10" fill="var(--text-muted)" text-anchor="middle" font-family="DM Mono, monospace">W${p.week}</text>`).join('');

  document.getElementById("chartBody").innerHTML = `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <polyline points="${points}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      ${dots}
      ${xLabels}
    </svg>`;
}

function renderActivity(results) {
  const card = document.getElementById("activityCard");
  if (results.length === 0) { card.style.display = "none"; return; }
  card.style.display = "block";

  const sorted = [...results].sort((a, b) => Mastery.toDate(b.timestamp) - Mastery.toDate(a.timestamp)).slice(0, 10);
  const html = sorted.map(r => {
    const pct = r.percentage || 0;
    const icon = pct >= 70 ? "🏆" : pct >= 50 ? "✅" : "📝";
    const iconClass = pct >= 70 ? "green" : pct >= 50 ? "blue" : "amber";
    const d = Mastery.toDate(r.timestamp);
    const timeStr = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const topics = Object.keys(r.topicBreakdown || {}).join(', ') || '—';
    return `
      <div class="activity-item">
        <div class="activity-icon ${iconClass}">${icon}</div>
        <div class="activity-text">
          <div class="title">${r.subject || "Quiz"} · Grade ${r.grade || "?"} — ${r.score || 0}/${r.total || "?"} correct</div>
          <div class="meta">${topics}</div>
        </div>
        <div class="activity-time">${timeStr}</div>
      </div>`;
  }).join('');

  document.getElementById("activityBody").innerHTML = html;
}
