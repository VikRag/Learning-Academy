<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Academy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4f6ef7;
    --primary-light: #eef1fe;
    --text: #1a1d2e;
    --text-muted: #7b7f96;
    --border: #e4e6f0;
    --surface: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f6fa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.5;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    padding: 52px 48px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-mark {
    width: 72px; height: 72px;
    background: var(--primary);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto 24px;
    box-shadow: 0 6px 20px rgba(79,110,247,0.3);
  }

  h1 {
    font-size: 2em;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--primary); }

  .subtitle {
    font-size: 1em;
    color: var(--text-muted);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .subject-pills {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }

  .pill {
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 0.82em;
    font-weight: 600;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
  }

  .pill.math    { background: #eef1fe; border-color: #eef1fe; color: #4f6ef7; }
  .pill.science { background: #dcfce7; border-color: #dcfce7; color: #16a34a; }
  .pill.english { background: #fef3c7; border-color: #fef3c7; color: #d97706; }
  .pill.social  { background: #f3e8ff; border-color: #f3e8ff; color: #9333ea; }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    padding: 14px;
    border-radius: 11px;
    font-family: inherit;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    text-decoration: none;
    display: block;
  }

  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #3d5ce5; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(79,110,247,0.35); }

  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 4px 0;
    color: var(--text-muted);
    font-size: 0.8em;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .footer-text {
    margin-top: 28px;
    font-size: 0.8em;
    color: var(--text-muted);
  }

  .footer-text strong { color: var(--text); }

  
  .lang-toggle { display: flex; gap: 4px; }
  .lang-btn {
    padding: 5px 10px; border-radius: 7px; border: 1.5px solid var(--border);
    background: var(--surface); font-family: inherit; font-size: 0.75em; font-weight: 700;
    color: var(--text-muted); cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--primary); }
  .lang-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
@media (max-width: 480px) {
    .card { padding: 36px 24px; }
  }
</style>
</head>
<body>

<div class="lang-toggle" style="position:fixed;top:20px;right:20px;z-index:10;">
  <button class="lang-btn active" data-lang="en" onclick="window.applyLanguage('en')">EN</button>
  <button class="lang-btn" data-lang="es" onclick="window.applyLanguage('es')">ES</button>
</div>

<div class="card">
  <div class="logo-mark">🎓</div>
  <h1>Learning <span>Academy</span></h1>
  <p class="subtitle" data-i18n="home_subtitle">Quiz yourself on Math, Science, English, and Social Studies — Grades 1–8.</p>

  <div class="subject-pills">
    <span class="pill math">➕ Math</span>
    <span class="pill science">🔬 Science</span>
    <span class="pill english">📖 English</span>
    <span class="pill social">🌍 Social Studies</span>
  </div>

  <div class="actions">
    <a href="login.html" class="btn btn-primary" data-i18n="home_login">Login to Your Account</a>
    <div class="divider" data-i18n="home_or">or</div>
    <a href="signup.html" class="btn btn-outline" data-i18n="home_signup">Create a Free Account</a>
  </div>

  <p class="footer-text" data-i18n="home_footer">Join students already learning with us ✨</p>
</div>

<script>
/* ── Language toggle (EN / ES) ──
   Translates static UI chrome — nav, headings, buttons, labels, empty
   states. Does NOT translate quiz question content itself: those come
   from the subject/grade JSON files, and auto-translating educational
   content risks introducing factual/wording errors into what students
   are being tested on, so that's intentionally left as a separate,
   human-reviewed task rather than done here.
   Preference is stored in localStorage so it's remembered per device
   without needing a database write. */
window.I18N = {
  en: {
    nav_dashboard: "Dashboard", nav_progress: "Progress", nav_viewer: "Family & Teacher View",
    nav_takequiz: "✏️ Take Quiz", nav_home: "Home", nav_myown: "My Own Dashboard", signup_back_home: "← Home",
    home_subtitle: "Quiz yourself on Math, Science, English, and Social Studies — Grades 1–8.",
    home_login: "Login to Your Account", home_signup: "Create a Free Account",
    home_footer: "Join students already learning with us ✨", home_or: "or",
    login_welcome: "Welcome back!", login_sub: "Log in to your account",
    login_email_ph: "Email", login_password_ph: "Password", login_btn: "Log In →",
    login_noaccount: "Don't have an account?", login_signup_link: "Sign up",
    signup_title: "Create your account", signup_sub: "Start tracking your learning journey.",
    signup_name_label: "Full Name", signup_email_label: "Email", signup_password_label: "Password",
    signup_btn: "Sign Up →", signup_haveaccount: "Already have an account?", signup_login_link: "Login",
    dash_welcome_sub: "Here's how you're doing across all your quizzes.",
    dash_progress_head: "📊 Your Progress — Overall Mastery",
    dash_readiness_head: "📝 Exam Readiness", dash_rec_head: "🎯 Recommended For You",
    dash_mastery_head: "🧠 Topic Mastery", dash_achv_head: "🏆 Achievements",
    dash_history_head: "📋 Quiz History", dash_share_head: "👨‍👩‍👧 Share With a Teacher or Parent",
    dash_share_desc: "Give this code to a teacher or parent so they can see your progress (read-only — they can't take quizzes or change anything for you).",
    progress_title: "Your Progress", progress_sub: "A closer look at mastery across every subject and topic.",
    progress_overall: "Overall Mastery", progress_subject: "📚 Subject Mastery",
    progress_chart: "📈 Improvement Over Time", progress_activity: "⚡ Recent Activity",
    viewer_title: "Family & Teacher View",
    viewer_sub: "Link to a student's account with their share code to see their progress — read-only, nothing here can change their quizzes or answers.",
    viewer_link_head: "🔗 Link a Student", viewer_link_btn: "Link Student",
    viewer_link_hint: "Ask the student to open their dashboard → \"Share With a Teacher or Parent\" to get their code.",
    viewer_roster_head: "👥 Linked Students",
  },
  es: {
    nav_dashboard: "Panel", nav_progress: "Progreso", nav_viewer: "Vista Familiar y Docente",
    nav_takequiz: "✏️ Hacer Cuestionario", nav_home: "Inicio", nav_myown: "Mi Propio Panel", signup_back_home: "← Inicio",
    home_subtitle: "Ponte a prueba en Matemáticas, Ciencias, Inglés y Estudios Sociales — Grados 1–8.",
    home_login: "Iniciar Sesión", home_signup: "Crear Cuenta Gratis",
    home_footer: "Únete a los estudiantes que ya aprenden con nosotros ✨", home_or: "o",
    login_welcome: "¡Bienvenido de nuevo!", login_sub: "Inicia sesión en tu cuenta",
    login_email_ph: "Correo electrónico", login_password_ph: "Contraseña", login_btn: "Iniciar Sesión →",
    login_noaccount: "¿No tienes una cuenta?", login_signup_link: "Regístrate",
    signup_title: "Crea tu cuenta", signup_sub: "Comienza a seguir tu progreso de aprendizaje.",
    signup_name_label: "Nombre Completo", signup_email_label: "Correo Electrónico", signup_password_label: "Contraseña",
    signup_btn: "Registrarse →", signup_haveaccount: "¿Ya tienes una cuenta?", signup_login_link: "Iniciar sesión",
    dash_welcome_sub: "Así te está yendo en todos tus cuestionarios.",
    dash_progress_head: "📊 Tu Progreso — Dominio General",
    dash_readiness_head: "📝 Preparación para el Examen", dash_rec_head: "🎯 Recomendado Para Ti",
    dash_mastery_head: "🧠 Dominio por Tema", dash_achv_head: "🏆 Logros",
    dash_history_head: "📋 Historial de Cuestionarios", dash_share_head: "👨‍👩‍👧 Compartir con un Maestro o Familiar",
    dash_share_desc: "Comparte este código con un maestro o familiar para que vean tu progreso (solo lectura: no pueden hacer cuestionarios ni cambiar nada por ti).",
    progress_title: "Tu Progreso", progress_sub: "Un vistazo más de cerca al dominio en cada materia y tema.",
    progress_overall: "Dominio General", progress_subject: "📚 Dominio por Materia",
    progress_chart: "📈 Mejora a lo Largo del Tiempo", progress_activity: "⚡ Actividad Reciente",
    viewer_title: "Vista Familiar y Docente",
    viewer_sub: "Vincúlate a la cuenta de un estudiante con su código para ver su progreso — solo lectura, esto no puede cambiar sus cuestionarios ni respuestas.",
    viewer_link_head: "🔗 Vincular un Estudiante", viewer_link_btn: "Vincular Estudiante",
    viewer_link_hint: "Pide al estudiante que abra su panel → \"Compartir con un Maestro o Familiar\" para obtener su código.",
    viewer_roster_head: "👥 Estudiantes Vinculados",
  }
};

window.applyLanguage = function (lang) {
  const dict = window.I18N[lang] || window.I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] != null) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    if (dict[key] != null) el.placeholder = dict[key];
  });
  document.documentElement.lang = lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
};

document.addEventListener('DOMContentLoaded', function () {
  let saved = 'en';
  try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
  window.applyLanguage(saved);
});

</script>
</body>
</html>
